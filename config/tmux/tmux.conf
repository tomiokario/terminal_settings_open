# tmux configuration managed by terminal_settings

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB,wezterm:RGB"
set -as terminal-features ",xterm-256color:clipboard:hyperlinks"
set -as terminal-features ",wezterm*:clipboard:hyperlinks"
set -g set-clipboard external

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
setw -g mode-keys vi
set -g history-limit 50000
set -g escape-time 10

# Keep the outer terminal title consistent when tmux is between the shell and WezTerm.
set -g set-titles on
set -g set-titles-string "[t] #{?#{m/r:^(pwsh|powershell|cmd|bash|zsh|fish)(\\.exe)?$,#{pane_current_command}},#{b:pane_current_path},#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{?#{==:#{pane_title},#{host_short}},#{pane_current_command},#{pane_title}}}}"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g status-interval 1
set -g status-position bottom
set -g status-style "bg=#161821,fg=#c6c8d1"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#84a0c6,bold]#S #[fg=#6b7089]| "
set -g status-right "#[fg=#6b7089]%Y-%m-%d #[fg=#84a0c6]%H:%M"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#84a0c6,fg=#161821,bold] #I:#W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#3d425b"
set -g pane-active-border-style "fg=#84a0c6"
set -g message-style "bg=#84a0c6,fg=#161821"
